name: Unpack CWEMS
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -q cwems.zip -d _tmp
          cp -a _tmp/cwems/. .
          rm -rf _tmp cwems.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Add CWEMS system"
          git push
